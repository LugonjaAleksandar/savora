name: savora
description: "Savora – a recipe explorer built as an architecture showcase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.3
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.2
  google_fonts: ^8.2.1
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  stream_transform: ^2.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
